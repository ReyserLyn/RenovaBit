name: Deploy VPS RenovaBit

on:
  push:
    branches:
      - main

concurrency:
  # Never cancel a deploy mid-flight: a half-recreated stack is worse than a
  # queued run. Rapid pushes queue instead of cancelling each other.
  group: deploy-renovabit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: [self-hosted, Linux, ARM64]

    env:
      DEPLOY_PATH: /opt/docker/renovabit

    steps:
      - name: Actualizar repo en VPS
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git fetch origin main
          git reset --hard origin/main

      - name: Verificar archivos de entorno
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
            for f in .env.api .env.db .env.redis; do
            if [ ! -f "$f" ]; then
              echo "::error::$f no existe en $DEPLOY_PATH"
              exit 1
            fi
            echo "[+] $f encontrado"
          done

      - name: Tag imágenes actuales como prev (rollback)
        shell: bash
        run: |
          for img in renovabit-api renovabit-admin renovabit-tienda; do
            docker tag "renovabit-$img:latest" "renovabit-$img:prev" 2>/dev/null && \
              echo "[+] Tagged $img:prev" || echo "[i] No hay imagen previa de $img"
          done

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          # Two builds in parallel on the 2-vCPU box. `--pull` was dropped: it
          # re-checked base images on every deploy. Refresh them manually with
          # `docker compose build --pull` when a base image changes.
          COMPOSE_PARALLEL_LIMIT=2 docker compose build

      - name: Asegurar servicios base (postgres, redis)
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          docker compose up -d --wait renovabit-postgres renovabit-redis

      - name: Backup de base de datos (pre-migración)
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          mkdir -p backups
          STAMP=$(date +%Y%m%d-%H%M%S)
          docker compose exec -T renovabit-postgres sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" --format=custom' > "backups/pre-deploy-$STAMP.dump"
          test -s "backups/pre-deploy-$STAMP.dump"
          ls -1t backups/pre-deploy-*.dump | tail -n +11 | xargs -r rm -f
          echo "[+] Backup creado: backups/pre-deploy-$STAMP.dump ($(du -h "backups/pre-deploy-$STAMP.dump" | cut -f1))"

      - name: Migraciones de base de datos
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          JOURNAL=$(echo "SELECT to_regclass('drizzle.__drizzle_migrations');" | docker compose exec -T renovabit-postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA' | tr -d '[:space:]')
          if [ -z "$JOURNAL" ]; then
            echo "::warning::No existe drizzle.__drizzle_migrations — el schema se gestiona fuera de drizzle-kit. Migración automática OMITIDA (revisar baseline)."
            exit 0
          fi
          # Non-interactive runner (programmatic migrator). MIGRATE_CONFIRM
          # authorizes applying migrations to the production database.
          docker compose run --rm --no-deps -e MIGRATE_CONFIRM=yes renovabit-api sh -lc "cd /app/packages/db && bun run db:migrate"

      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          # --wait blocks until every service with a healthcheck reports healthy,
          # so a crash-looping container fails the deploy and the rollback step
          # takes over (a "running" container is not enough).
          docker compose up -d --wait --wait-timeout 120

      - name: Verificar containers activos
        shell: bash
        run: |
          sleep 5
          for svc in renovabit-postgres renovabit-redis renovabit-api renovabit-admin renovabit-tienda; do
            STATUS=$(docker inspect --format='{{.State.Status}}' "$svc" 2>/dev/null || echo "not_found")
            if [ "$STATUS" = "running" ]; then
              echo "[+] $svc está running"
            else
              echo "[!] $svc no está running (status: $STATUS)"
              docker logs "$svc" --tail=20 2>&1
              exit 1
            fi
          done

      - name: Rollback automático (si deploy falló)
        if: failure()
        shell: bash
        run: |
          echo "[!] Deploy falló — restaurando versión previa..."
          for img in renovabit-api renovabit-admin renovabit-tienda; do
            if docker image inspect "renovabit-$img:prev" &>/dev/null; then
              docker tag "renovabit-$img:prev" "renovabit-$img:latest"
              echo "[-] Restaurado $img:prev → $img:latest"
            fi
          done
          cd "$DEPLOY_PATH"
          docker compose up -d

      - name: Limpiar imágenes antiguas (>24h)
        if: success()
        shell: bash
        run: |
          docker image prune -f --filter "until=24h"
          # Keeps the disk from filling up with old build cache while leaving
          # the recent (hot) cache and cache mounts intact.
          docker builder prune -f --filter "until=336h" >/dev/null 2>&1 || true

      - name: Notificar éxito
        if: success()
        shell: bash
        run: |
          curl -s -X POST "${{ vars.GOTIFY_URL }}/message" \
            -H "X-Gotify-Key: ${{ secrets.GOTIFY_APP_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"title": "[+] Deploy exitoso - Renovabit", "message": "API, Admin y Tienda desplegados correctamente.", "priority": 5}'

      - name: Notificar fallo
        if: failure()
        shell: bash
        run: |
          cd "$DEPLOY_PATH"
          LOGS=$(docker compose logs --tail=20 2>&1)
          {
            echo "[!] Deploy falló - Renovabit"
            echo ""
            echo "Logs:"
            echo "$LOGS"
          } | jq -Rs '{title: "[!] Deploy falló - Renovabit", message: ., priority: 8}' | \
          curl -s -X POST "${{ vars.GOTIFY_URL }}/message" \
            -H "X-Gotify-Key: ${{ secrets.GOTIFY_APP_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @-
