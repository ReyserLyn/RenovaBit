name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: [self-hosted, Linux, ARM64]

    env:
      VITE_API_URL: https://api.renovabit.com
      VITE_SITE_URL: https://tienda.renovabit.com
      # Import-time only: lets @renovabit/db load without a live database during
      # lint, type check and build. The DB-backed tests get their own throwaway
      # Postgres (see the step below); port 1 refuses instantly because 5432 on
      # this runner is answered by Traefik's TCP entrypoint, which accepts the
      # connection and hangs the handshake (5s test timeout).
      DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Instalar dependencias (lockfile estricto)
        run: bun install --frozen-lockfile

      - name: Formato y lint
        run: bunx biome ci .

      - name: Type check
        run: bunx turbo run check-types

      # DB-backed tests skip silently when Postgres is unreachable, which left
      # the rollback and pricing regressions unenforced in CI. A throwaway
      # Postgres on a dynamic host port gives them a real database; the host
      # port is random so concurrent runs (main + a PR) cannot collide, and it
      # avoids 5432, which belongs to Traefik on this runner.
      - name: Levantar Postgres para los tests
        id: postgres
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER="renovabit-ci-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          docker run -d --rm --name "$CONTAINER" \
            -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci \
            -p 0:5432 postgres:18.4 >/dev/null
          HOST_PORT="$(docker port "$CONTAINER" 5432/tcp | head -n1 | sed 's/.*://')"
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"
          echo "database_url=postgres://ci:ci@127.0.0.1:${HOST_PORT}/ci" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 30); do
            if docker exec "$CONTAINER" pg_isready -U ci -d ci >/dev/null 2>&1; then
              echo "[+] Postgres listo en el puerto ${HOST_PORT}"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Postgres no quedó listo a tiempo"
          docker logs "$CONTAINER" || true
          exit 1

      - name: Migrar la base de datos de tests
        env:
          DATABASE_URL: ${{ steps.postgres.outputs.database_url }}
        run: bun run --filter @renovabit/db db:migrate

      - name: Tests
        env:
          DATABASE_URL: ${{ steps.postgres.outputs.database_url }}
        run: bunx turbo run test

      - name: Build
        run: bunx turbo run build

      # Boots the API the way production does and requires a real HTTP response.
      # This is the only gate that catches boot-time crashes that types, lint
      # and unit tests cannot see (e.g. a plugin evaluated at import time).
      - name: Boot smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd apps/api
          NODE_ENV=production \
          PORT=3099 \
          DATABASE_URL=postgres://ci:ci@127.0.0.1:1/ci \
          BETTER_AUTH_SECRET=ci-smoke-secret \
          API_URL=http://localhost:3001 \
          ADMIN_URL=http://localhost:3002 \
          STORE_URL=http://localhost:3003 \
          LANDING_URL=http://localhost:3000 \
          R2_ACCOUNT_ID=ci R2_ACCESS_KEY_ID=ci R2_SECRET_ACCESS_KEY=ci \
          R2_BUCKET_NAME=ci R2_PUBLIC_URL=http://localhost/r2 \
          bun src/index.ts > /tmp/api-smoke.log 2>&1 &
          SMOKE_PID=$!
          trap 'kill "$SMOKE_PID" 2>/dev/null || true' EXIT

          CODE=""
          for _ in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 "http://localhost:3099/health" || true)
            if [ -n "$CODE" ] && [ "$CODE" != "000" ]; then
              break
            fi
            if ! kill -0 "$SMOKE_PID" 2>/dev/null; then
              echo "::error::La API murió al arrancar (NODE_ENV=production)"
              cat /tmp/api-smoke.log
              exit 1
            fi
            sleep 1
          done

          if [ -z "$CODE" ] || [ "$CODE" = "000" ]; then
            echo "::error::La API no respondió en el smoke test"
            cat /tmp/api-smoke.log
            exit 1
          fi

          echo "[+] API respondió con HTTP $CODE (proceso vivo)"

      # Runs even when an earlier step failed so the self-hosted runner never
      # accumulates stopped-but-present containers.
      - name: Limpiar Postgres
        if: always()
        shell: bash
        run: docker rm -f "${{ steps.postgres.outputs.container }}" >/dev/null 2>&1 || true
