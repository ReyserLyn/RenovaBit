name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: [self-hosted, Linux, ARM64]

    env:
      VITE_API_URL: https://api.renovabit.com
      VITE_SITE_URL: https://tienda.renovabit.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Instalar dependencias (lockfile estricto)
        run: bun install --frozen-lockfile

      - name: Formato y lint
        run: bunx biome ci .

      - name: Type check
        run: bunx turbo run check-types

      - name: Tests
        run: bunx turbo run test

      - name: Build
        run: bunx turbo run build
